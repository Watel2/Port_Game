name: Check nxnative iOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out nxnative
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seedds/nxnative
          ref: 2f959ede5f1e08f10fe214e2e61933a051bdd515
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          architecture: arm64

      - name: Prepare Xcode and Metal
        shell: bash
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -downloadComponent MetalToolchain
          xcrun --sdk iphoneos metal --version
          command -v xcodegen || brew install xcodegen

      - name: Compile and link the iOS app with synthetic inputs
        env:
          DM_GAME: "010062E01FE0C000"
        shell: bash
        run: python dm/ios/tools/build_smoke.py --output "$RUNNER_TEMP/nxnative-ios-smoke"
