name: Build One Piece Pirate Warriors 4 iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      BUILD_STORAGE: Watel2/Port_Game-build-private
    steps:
      - name: Fetch the private build inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PORTGAME_PRIVATE_BUILD_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set PORTGAME_PRIVATE_BUILD_TOKEN with Contents read and write access to the private build storage."
            exit 1
          fi
          test "$(gh repo view "$BUILD_STORAGE" --json visibility --jq '.visibility')" = PRIVATE
          gh release download one-piece-pw4-inputs-v1179648 \
            --repo "$BUILD_STORAGE" \
            --pattern 'OnePiecePW4-1.8.7-build-inputs.zip' --pattern 'control.nacp' --dir "$RUNNER_TEMP"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seedds/nxnative
          ref: 2f959ede5f1e08f10fe214e2e61933a051bdd515
          path: nxnative
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          architecture: arm64

      - name: Prepare Xcode and build tools
        shell: bash
        run: |
          df -h "$RUNNER_TEMP"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          brew install xcodegen zstd glslang
          python -m pip install lz4 "capstone>=5,<6" fonttools zbic

      - name: Build and verify the IPA with separate data
        shell: bash
        run: |
          python -u .github/scripts/build_thin_ipa.py nxnative \
            "$RUNNER_TEMP/OnePiecePW4-1.8.7-build-inputs.zip" \
            "$RUNNER_TEMP/control.nacp" \
            "$RUNNER_TEMP/thin-build" \
            "$RUNNER_TEMP/PortGameIPA/OnePiecePW4-1.8.7-unsigned.ipa" --one-piece

      - name: Save the IPA to the private build repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PORTGAME_PRIVATE_BUILD_TOKEN }}
        working-directory: ${{ runner.temp }}/PortGameIPA
        run: |
          test "$(gh repo view "$BUILD_STORAGE" --json visibility --jq '.visibility')" = PRIVATE
          ipa=OnePiecePW4-1.8.7-unsigned.ipa
          shasum -a 256 "$ipa" > SHA256SUMS.txt
          files=("$ipa")
          if (( $(stat -f %z "$ipa") >= 2147483648 )); then
            split -b 1500000000 -a 2 "$ipa" "$ipa.part."
            files=("$ipa".part.*)
          fi
          tag="pw4-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" "${files[@]}" SHA256SUMS.txt \
            --repo "$BUILD_STORAGE" --title "One Piece PW4 1.8.7 unsigned" \
            --notes "Verified unsigned build. If split into .part files, concatenate in name order and verify against SHA256SUMS.txt." --draft
          gh release edit "$tag" --repo "$BUILD_STORAGE" --draft=false
